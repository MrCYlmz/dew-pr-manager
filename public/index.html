<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pull Request Manager</title>
<link rel="stylesheet" href="/styles.css" />
<script>
  // Apply the saved theme before first paint so a forced theme never flashes the OS one.
  // Absent or "auto" -> no attribute -> the prefers-color-scheme media query decides.
  try { var t = localStorage.getItem("prManagerTheme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Pull Request Manager</h1>
    </div>
    <div id="scan-meta" class="scan-meta">Starting up…</div>
    <button id="settings-btn" type="button" class="btn" aria-haspopup="dialog" aria-controls="settings">
      <span class="btn-icon" id="settings-icon" aria-hidden="true"></span>
      Spec rule
    </button>
    <button id="theme-btn" type="button" class="btn" title="Colour theme: follows the OS. Click to cycle.">
      <span class="btn-icon" id="theme-icon" aria-hidden="true"></span>
      <span id="theme-label">Auto</span>
    </button>
    <button id="refresh-btn" type="button" class="btn btn-refresh">
      <span class="btn-icon" id="refresh-icon" aria-hidden="true"></span>
      <span id="refresh-label">Refresh</span>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-view="overview" class="tab" type="button">Overview <span class="tab-count" id="count-overview"></span></button>
    <button data-view="mine" class="tab" type="button">My PRs <span class="tab-count" id="count-mine"></span></button>
    <button data-view="review" class="tab" type="button">To review <span class="tab-count" id="count-review"></span></button>
  </nav>
</header>

<div id="error-banner" class="error-banner hidden" role="status"></div>

<main class="shell" id="main">
  <section id="summary" class="summary" aria-label="Summary"></section>

  <div class="columns">
    <div class="col-main">
      <section id="connections-section" class="connections-slot" aria-label="Change set connections"></section>
    </div>
    <div class="col-side">
      <section id="changes-section" class="panel-slot" aria-label="Changes since your last visit"></section>
    </div>
  </div>

  <section id="buckets-section" class="buckets" aria-label="Pull requests by what they need"></section>
</main>

<div id="drawer-scrim" class="drawer-scrim hidden"></div>
<aside id="drawer" class="drawer hidden" aria-label="Pull request detail" tabindex="-1"></aside>
<aside id="settings" class="drawer hidden" role="dialog" aria-label="Spec-PR rule" tabindex="-1"></aside>

<script type="module" src="/app.js"></script>
</body>
</html>
